<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAVEH</title>
<style>
:root{--bg:#0f1a33;--card:#1d3260;--card2:#0d1a38;--line:#3d5694;--ink:#f8f0de;--gold:#ffc233;--gold2:#e8860f;--dim:#9fb0d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#g{position:absolute;top:0;left:0;right:0;bottom:0}
#ov{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,45,.35)}
#ov[hidden]{display:none}
.card{background:linear-gradient(var(--card),var(--card2));border:2px solid var(--line);border-radius:22px;padding:18px 22px;min-width:240px;max-width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card.bare{background:none;border:0;box-shadow:none;padding:0}
.sub{font:900 28px/1.3 Impact,'Arial Black',sans-serif;margin:0}
.tag{font-size:14px;color:var(--dim);margin:6px 0 4px}
.big{margin-top:10px;min-width:200px;padding:12px 28px;border:3px solid #3a1d00;border-radius:18px;background:linear-gradient(#ffd45c,var(--gold2));color:#3a1d00;font:900 34px Impact,'Arial Black',sans-serif;box-shadow:0 5px 0 #8a4a05}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4a05}
.fab{position:absolute;top:8px;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:2px solid #3a1d00;background:var(--gold);font-size:17px;padding:0}
#restart{right:54px}
#rot{display:none;position:absolute;top:10px;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:3;background:var(--gold);color:#3a1d00;border-radius:14px;padding:6px 12px;font-size:13px;pointer-events:none;white-space:nowrap}
@media (orientation:portrait){#rot{display:block}}
</style>
</head>
<body>
<div id="g"></div>
<button class="fab" id="restart" onclick="toStart()" aria-label="restart">↻</button>
<button class="fab" id="mute" onclick="toggleMute()" aria-label="sound">🔊</button>
<div id="rot">📱↻</div>
<pre id="err" hidden style="position:absolute;top:48px;left:8px;right:8px;z-index:9;background:#5a0f0f;color:#fff;font:11px monospace;padding:6px;white-space:pre-wrap;direction:ltr;text-align:left;border-radius:8px"></pre>
<div id="ov"></div>
<script src="phaser.min.js"></script>
<script src="assets.js"></script>
<script src="sim.js"></script>
<script src="game.js"></script>
</body>
</html>
